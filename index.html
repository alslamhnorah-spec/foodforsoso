<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WHAT ARE WE EATING?</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@500;700;800&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f6efdf;
    color: #241b15;
    font-family: Cairo, Arial, sans-serif;
    overflow-x: hidden;
}

/* Food pattern */
body::before {
    content: "🍔   🍟   🥪   🍗   🍕   🥞   🍔   🍟   🥪";
    position: fixed;
    inset: 0;
    font-size: 38px;
    line-height: 110px;
    letter-spacing: 25px;
    opacity: .045;
    transform: rotate(-10deg) scale(1.2);
    pointer-events: none;
    z-index: -1;
}

/* Top bar */
.top {
    background: #e74724;
    color: white;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 5px solid #241b15;
}

.logo {
    font-family: Anton, sans-serif;
    font-size: 25px;
    letter-spacing: 1px;
}

.badge {
    background: #ffd34e;
    color: #241b15;
    padding: 6px 11px;
    border: 2px solid #241b15;
    box-shadow: 3px 3px 0 #241b15;
    font-weight: 800;
    transform: rotate(3deg);
}

/* Main */
.container {
    max-width: 540px;
    margin: auto;
    padding: 30px 18px 60px;
    text-align: center;
}

/* Hero */
.hero {
    background: #fffaf0;
    border: 4px solid #241b15;
    box-shadow: 8px 8px 0 #241b15;
    padding: 30px 15px;
    transform: rotate(-1deg);
}

.food-icons {
    font-size: 50px;
}

h1 {
    font-family: Anton, sans-serif;
    font-size: 48px;
    line-height: .95;
    margin: 15px 0;
}

.hero p {
    color: #66584d;
    font-size: 15px;
    font-weight: 700;
}

/* Button */
button {
    font-family: Cairo, Arial, sans-serif;
    font-weight: 800;
    cursor: pointer;
}

.main-btn {
    margin-top: 22px;
    background: #241b15;
    color: white;
    border: none;
    padding: 16px 35px;
    font-size: 18px;
    border-radius: 5px;
    box-shadow: 5px 5px 0 #e74724;
    transition: .15s;
}

.main-btn:active {
    transform: translate(3px,3px);
    box-shadow: 2px 2px 0 #e74724;
}

/* Roulette */
.roulette {
    margin-top: 35px;
    background: #fffaf0;
    border: 4px solid #241b15;
    box-shadow: 8px 8px 0 #241b15;
    padding: 25px 14px 30px;
}

.title {
    font-family: Anton, sans-serif;
    font-size: 32px;
}

.small {
    color: #756459;
    font-size: 14px;
}

/* Wheel */
.wheel-area {
    width: 310px;
    height: 310px;
    margin: 25px auto;
    position: relative;
}

.wheel {
    width: 310px;
    height: 310px;
    border-radius: 50%;
    border: 9px solid #241b15;

    background: conic-gradient(
        #f36b3c 0deg 120deg,
        #ffd34e 120deg 240deg,
        #e74724 240deg 360deg
    );

    position: relative;

    box-shadow:
        inset 0 0 0 5px #fffaf0,
        8px 8px 0 #241b15;

    transition:
        transform 4s cubic-bezier(.12,.8,.18,1);
}

/* Food labels */
.food {
    position: absolute;
    width: 50%;
    height: 50%;
    left: 25%;
    top: 25%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-weight: 900;
    font-size: 15px;
    text-align: center;
    z-index: 2;
}

.food span {
    width: 105px;
    line-height: 1.2;
}

.food1 {
    transform: rotate(60deg) translateY(-82px);
}

.food2 {
    transform: rotate(180deg) translateY(-82px);
}

.food3 {
    transform: rotate(300deg) translateY(-82px);
}

/* Center */
.center {
    position: absolute;
    width: 72px;
    height: 72px;
    background: #fffaf0;
    border: 5px solid #241b15;
    border-radius: 50%;

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
    z-index: 5;
}

/* Pointer */
.pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 38px solid #241b15;

    z-index: 10;
}

/* Result */
.result {
    display: none;
    margin-top: 30px;
    animation: pop .5s ease;
}

.result.show {
    display: block;
}

.result-box {
    background: #ffd34e;
    border: 4px solid #241b15;
    padding: 25px 15px;
    box-shadow: 6px 6px 0 #241b15;
}

.result-emoji {
    font-size: 52px;
}

.result-name {
    font-family: Anton, sans-serif;
    font-size: 40px;
    margin: 5px 0;
}

.result-text {
    font-size: 17px;
    line-height: 1.8;
    font-weight: 800;
}

/* Special Muttabaq message */
.special {
    background: #e74724;
    color: white;
    border: 3px solid #241b15;
    margin-top: 18px;
    padding: 18px 12px;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.7;
}

/* Again */
.again {
    margin-top: 18px;
    background: white;
    color: #241b15;
    border: 3px solid #241b15;
    padding: 10px 20px;
    font-size: 14px;
}

/* Confetti */
.confetti {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 100;
    pointer-events: none;
    font-size: 27px;
}

/* Animation */
@keyframes pop {
    from {
        opacity: 0;
        transform: scale(.65) rotate(-3deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@media (max-width: 380px) {

    .wheel-area,
    .wheel {
        width: 280px;
        height: 280px;
    }

    .food1 {
        transform: rotate(60deg) translateY(-74px);
    }

    .food2 {
        transform: rotate(180deg) translateY(-74px);
    }

    .food3 {
        transform: rotate(300deg) translateY(-74px);
    }

    h1 {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="logo">FOOD ROULETTE 🍔</div>
    <div class="badge">NO CHEATING</div>
</div>


<div class="container">

    <!-- FIRST SCREEN -->

    <div class="hero">

        <div class="food-icons">
            🍔 🍟 🥪
        </div>

        <h1>
            WHAT ARE<br>
            WE EATING?
        </h1>

        <p>
            You said you wanted to choose...
            <br>
            so let's make it completely fair ياقطوه
        </p>

        <button
            class="main-btn"
            onclick="showRoulette()">

            🎲 LET’S SPIN

        </button>

    </div>


    <!-- ROULETTE -->

    <div
        class="roulette"
        id="roulette"
        style="display:none;">

        <div class="title">
            FOOD ROULETTE
        </div>

        <div class="small">
            No choosing. Let the wheel decide
        </div>


        <div class="wheel-area">

            <div class="pointer"></div>

            <div
                class="wheel"
                id="wheel">

                <div class="food food1">
                    <span>
                        Plenty Sld’s 🍔
                    </span>
                </div>

                <div class="food food2">
                    <span>
                        مطبق 
                    </span>
                </div>

                <div class="food food3">
                    <span>
                        Subway 🥪
                    </span>
                </div>

                <div class="center">
                    🎲
                </div>

            </div>

        </div>


        <button
            class="main-btn"
            id="spinBtn"
            onclick="spin()">

            SPIN IT 🎲

        </button>


        <!-- RESULT -->

        <div
            class="result"
            id="result">

            <div class="result-box">

                <div
                    class="result-emoji"
                    id="resultEmoji">
                </div>

                <div
                    class="result-name"
                    id="resultName">
                </div>

                <div
                    class="result-text"
                    id="resultText">
                </div>

                <div
                    id="specialMessage">
                </div>

                <button
                    class="again"
                    onclick="spinAgain()">

                    🔄 SPIN AGAIN

                </button>

            </div>

        </div>

    </div>

</div>


<!-- YouTube Laugh Sound -->

<iframe
    id="laughSound"
    width="1"
    height="1"
    style="
        position:fixed;
        left:-100px;
        bottom:-100px;
        opacity:0;
        pointer-events:none;
    "
    src="https://www.youtube.com/embed/9D9J4i3SasQ?enablejsapi=1"
    allow="autoplay">
</iframe>


<script>

const wheel =
    document.getElementById("wheel");

const result =
    document.getElementById("result");

const resultEmoji =
    document.getElementById("resultEmoji");

const resultName =
    document.getElementById("resultName");

const resultText =
    document.getElementById("resultText");

const specialMessage =
    document.getElementById("specialMessage");

const spinBtn =
    document.getElementById("spinBtn");


let rotation = 0;
let spinning = false;


/*
   3 OPTIONS ONLY
*/

const foods = [

    {
        name: "PLENTY SLD’S",
        emoji: "💋",
        text: ""
    },

   {
    name: "مطبق",
    emoji: "",
    text: ""
},

    {
        name: "SUBWAY",
        emoji: "🥪",
        text: "Subway it is! "
    }

];


/*
   SHOW ROULETTE
*/

function showRoulette() {

    document.getElementById("roulette").style.display =
        "block";

    document.getElementById("roulette")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/*
   SPIN
*/

function spin() {

    if (spinning) return;

    spinning = true;

    spinBtn.disabled = true;

    result.classList.remove("show");

    specialMessage.innerHTML = "";


    /*
       Random number:
       0 = Plenty
       1 = Muttabaq
       2 = Subway
    */

    const selected =
        Math.floor(Math.random() * 3);


    /*
       Each section = 120 degrees
    */

    const target =
        360 - (selected * 120 + 60);


    /*
       Six full spins
    */

    rotation +=
        360 * 6 + target;


    wheel.style.transform =
        `rotate(${rotation}deg)`;


    setTimeout(() => {

        const food =
            foods[selected];


        resultEmoji.innerHTML =
            food.emoji;

        resultName.innerHTML =
            food.name;

        resultText.innerHTML =
            food.text;


        /*
           MUTTABBAQ
        */

        if (selected === 1) {

            specialMessage.innerHTML = `

                <div class="special">

                    مافي دلع أوكي؟ 😂

                    <br><br>

                    تحصلينه بالجامعة مرة ثانية
                    <br>
                    تسوين فطور ببيتكم 😂

                </div>

            `;

            playLaugh();

            funnyConfetti();

        }


        /*
           OTHER FOOD
        */

        else {

            cuteConfetti();

        }


        result.classList.add("show");

        spinning = false;

        spinBtn.disabled = false;


        setTimeout(() => {

            result.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }, 200);


    }, 4100);

}


/*
   SPIN AGAIN
*/

function spinAgain() {

    result.classList.remove("show");

    setTimeout(() => {

        document.getElementById("roulette")
            .scrollIntoView({
                behavior: "smooth"
            });

    }, 200);

}


/*
   PLAY LAUGH
*/

function playLaugh() {

    const iframe =
        document.getElementById("laughSound");

    iframe.contentWindow.postMessage(

        JSON.stringify({

            event: "command",

            func: "playVideo",

            args: []

        }),

        "*"

    );

}


/*
   NORMAL CONFETTI
*/

function cuteConfetti() {

    createConfetti(
        ["🍔", "🥪", "🍟", "🎉"],
        20
    );

}


/*
   MUTTABBAQ CONFETTI 😂
*/

function funnyConfetti() {

    createConfetti(
        ["😂", "😭", "🥞", "💀", "😂"],
        35
    );

}


/*
   CREATE CONFETTI
*/

function createConfetti(icons, amount) {

    for (let i = 0; i < amount; i++) {

        const el =
            document.createElement("div");

        el.className =
            "confetti";

        el.innerHTML =
            icons[
                Math.floor(
                    Math.random() * icons.length
                )
            ];


        document.body.appendChild(el);


        const x =
            (Math.random() - .5) * 550;

        const y =
            (Math.random() - .5) * 500;


        el.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(.4)",

                    opacity: 1
                },

                {

                    transform:
                        `translate(${x}px, ${y}px)
                         rotate(360deg)
                         scale(1.5)`,

                    opacity: 0

                }

            ],

            {

                duration:
                    1200 +
                    Math.random() * 800,

                easing: "ease-out"

            }

        );


        setTimeout(
            () => el.remove(),
            2200
        );

    }

}

</script>

</body>
</html>
